services:
  - type: web
    name: studytrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STUDYTRACK_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_API_DOCS
        value: "false"